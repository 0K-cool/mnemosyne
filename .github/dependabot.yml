version: 2

# v1.1.0 HIGH-4 hardening + lesson from PAI PR #20: SHA-pinned actions
# must have Dependabot coverage, otherwise pins silently age past their
# current major and security updates are missed. Dependabot's
# major-version awareness surfaces that drift automatically.

updates:
  - package-ecosystem: github-actions
    directory: /
    # Wait a week before a newly published version is proposed. A compromised
    # release is typically caught and yanked within days; without a cooldown
    # Dependabot would open the PR within hours of publication, which is the
    # window that attack depends on.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
